<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}VulnFlags Chain{% endblock %}</title><style>
:root{--bg:#06101e;--panel:#0d1c31;--line:#263e63;--text:#eef5ff;--muted:#9fb1ca;--blue:#4ca6ff;--cyan:#49ead4;--red:#ff7184;--green:#66e7a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#173963,transparent 32%),radial-gradient(circle at 95% 5%,#12464a,transparent 27%),var(--bg);color:var(--text);font:15px Segoe UI,Arial,sans-serif;min-height:100vh}.shell{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;background:#0d1c31df;border:1px solid var(--line);padding:14px 18px;border-radius:18px;position:sticky;top:12px;z-index:5}.brand{font-weight:900;text-decoration:none}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:var(--muted);text-decoration:none;padding:8px 11px;border-radius:9px}.nav a:hover{background:#183352;color:white}main{padding:38px 0}.panel{background:linear-gradient(145deg,#122743f5,#09172af5);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 65px #0006}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}h1{font-size:58px;line-height:1;margin:10px 0 18px;letter-spacing:-2px}h2{font-size:29px;margin:0 0 13px}h3{margin:0 0 8px}p{color:var(--muted);line-height:1.65}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.gradient{background:linear-gradient(90deg,#fff,var(--cyan));background-clip:text;color:transparent}.btn{display:inline-block;background:linear-gradient(135deg,var(--blue),#3978ff);color:white;text-decoration:none;border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}.btn.secondary{background:#19324f;border:1px solid var(--line)}.notice{padding:14px 16px;border-radius:14px;border:1px solid;margin:15px 0}.info{background:#102c49;border-color:#2b5e91}.ok{background:#123928;border-color:#327954}.danger{background:#3d1822;border-color:#813348}.warn{background:#3b2d14;border-color:#77571e}.flag{font:700 16px Consolas,monospace;color:#97f3bd;background:#07150f;border:1px solid #2c7951;border-radius:12px;padding:15px}.steps,.data,.money{display:grid;gap:14px}.steps{grid-template-columns:repeat(2,1fr);margin-top:20px}.step,.card{background:#091a2e;border:1px solid var(--line);border-radius:16px;padding:18px}.badge{display:inline-block;background:#17385e;color:#92cbff;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}form{display:grid;gap:13px}.field label{display:block;color:#cad8eb;margin-bottom:7px}.field input,.field textarea{width:100%;background:#071629;color:white;border:1px solid #36547a;border-radius:12px;padding:13px}.profile-head{display:flex;justify-content:space-between;gap:18px}.data{grid-template-columns:repeat(2,1fr);margin-top:16px}.card span,.metric span{display:block;color:#7891b2;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.money{grid-template-columns:repeat(3,1fr);margin-top:15px}.metric{background:linear-gradient(145deg,#0c302c,#102641);border:1px solid #29635d;border-radius:17px;padding:19px}.metric strong{font-size:24px;color:#baffdf}.comment{margin-top:12px;padding:15px;border:1px solid var(--line);border-radius:13px;background:#091a2e}@media(max-width:780px){.hero,.steps,.data,.money{grid-template-columns:1fr}.top,.profile-head{align-items:flex-start;flex-direction:column}h1{font-size:42px}}
</style></head><body><div class="shell"><header class="top"><a class="brand" href="/">VULNFLAGS // CHAIN</a><nav class="nav"><a href="/">Início</a><a href="/login">Etapa SQLi</a><a href="/profile">Portal Financeiro</a><a href="/comments">XSS bônus</a><a href="/logout">Sair</a></nav></header><main>{% block content %}{% endblock %}</main></div></body></html>
